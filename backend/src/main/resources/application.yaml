spring:
  application:
    name: api
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

myopty:
  documents:
    max-size-bytes: 10485760
    content-types:
      - image/jpeg
      - image/png
      - image/webp
      - image/heic
      - application/pdf
    storage:
      minio:
        endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
        access-key: ${MINIO_ACCESS_KEY:myuser}
        secret-key: ${MINIO_SECRET_KEY:verysecret}
        bucket: ${MINIO_BUCKET:prescription-documents}
        auto-create-bucket: true
