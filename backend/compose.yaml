services:
  mysql:
    image: 'mysql:latest'
    environment:
      - 'MYSQL_DATABASE=mydatabase'
      - 'MYSQL_PASSWORD=secret'
      - 'MYSQL_ROOT_PASSWORD=verysecret'
      - 'MYSQL_USER=myuser'
    ports:
      - '3306'

  # S3-compatible object storage for customer prescription documents.
  # Console: http://localhost:9001 (myuser / verysecret)
  minio:
    image: 'minio/minio:latest'
    command: 'server /data --console-address ":9001"'
    environment:
      - 'MINIO_ROOT_USER=myuser'
      - 'MINIO_ROOT_PASSWORD=verysecret'
    ports:
      - '9000'
      - '9001'
    volumes:
      - 'minio-data:/data'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 12

  # Creates the prescription document bucket once MinIO is reachable.
  minio-init:
    image: 'minio/mc:latest'
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - 'MINIO_ROOT_USER=myuser'
      - 'MINIO_ROOT_PASSWORD=verysecret'
      - 'MINIO_BUCKET=prescription-documents'
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb --ignore-existing local/$${MINIO_BUCKET};
      /usr/bin/mc anonymous set none local/$${MINIO_BUCKET};
      "

volumes:
  minio-data:
